name: Refresh healthcare startup job feed
on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jobs-ingestion
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run public ATS ingestion
        run: python scripts/ingest.py
      - name: Commit refreshed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jobs.json
          git diff --cached --quiet || git commit -m 'chore: refresh healthcare startup job feed'
          git push
